<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>마음의 숲</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=Silkscreen&display=swap">
<style>
/* Layout: one-screen pixel game — wood-tone top bar, full-bleed forest canvas, ivory dialog windows framed in wood */
:root{
  --ink:#2b2118; --wood:#9a6a3f; --wood-dark:#6b4526; --wood-light:#c79260;
  --ivory:#fbf3df; --ivory-2:#f0e2c2; --moss:#4f7d47; --moss-dark:#365a32;
  --text:#3a2c20; --muted:#7a6650; --alert:#b5523b; --amber:#c9902f;
  --scrim:rgba(34,24,14,.5); --forest-deep:#2e4a2c;
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-story:"Gowun Batang","Nanum Myeongjo",serif;
  --f-pixel:"Silkscreen",ui-monospace,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--forest-deep);color:var(--text);font-family:var(--f-body);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* top bar */
.bar{background:var(--wood);border-bottom:3px solid var(--ink);box-shadow:inset 0 -4px 0 var(--wood-dark),inset 0 2px 0 var(--wood-light);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:10px;color:var(--ivory)}
.brand canvas{width:24px;height:31px;image-rendering:pixelated}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1;text-shadow:0 2px 0 var(--ink)}
.brand span{font-family:var(--f-pixel);font-size:10px;letter-spacing:.08em;color:var(--ivory-2);opacity:.85}
nav{display:flex;gap:6px;overflow-x:auto;min-width:0;flex:1;justify-content:flex-end;scrollbar-width:none;padding-bottom:3px}
nav::-webkit-scrollbar{display:none}
.nb{flex:none;font-family:var(--f-display);font-size:15px;background:var(--wood-light);color:var(--ink);border:2px solid var(--ink);
  box-shadow:0 3px 0 var(--ink);padding:6px 11px;position:relative;white-space:nowrap}
.nb:hover{background:#d6a26e}
.nb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.nb b{font-family:var(--f-pixel);font-weight:400;font-size:10px;background:var(--alert);color:var(--ivory);padding:1px 4px;margin-left:4px;border:1px solid var(--ink)}
@media (max-width:640px){ nav{flex-basis:100%;justify-content:flex-start} .bar{gap:8px} }

/* stage */
.stage{flex:1;position:relative;min-height:0}
#world{width:100%;height:100%;display:block;touch-action:none;cursor:pointer;image-rendering:pixelated}
.plaque{position:absolute;background:var(--ivory);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--wood),0 0 0 6px var(--ink);padding:8px 12px;font-size:13px;line-height:1.45}
.hud{left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 36px)}
.hud strong{font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--moss-dark)}
.hud .num{font-family:var(--f-pixel);font-variant-numeric:tabular-nums}
.hud .sub{color:var(--muted);font-size:12px}
.keys{right:calc(18px + env(safe-area-inset-right,0px));top:18px;font-size:12px;color:var(--muted)}
.keys kbd{font-family:var(--f-pixel);font-size:10px;background:var(--ivory-2);border:1px solid var(--ink);padding:0 4px;color:var(--ink)}
@media (max-width:640px){ .keys{display:none} }
.help{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
  font-family:var(--f-display);font-size:14px;background:var(--ivory);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--wood),0 0 0 6px var(--ink);padding:7px 12px;color:var(--alert)}
@media (max-width:640px){ .hud{bottom:calc(70px + env(safe-area-inset-bottom,0px))} }
.toast{position:fixed;z-index:20;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100% - 40px);text-align:center;font-size:14px;z-index:3}
.mode{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:12px;color:var(--muted);display:none}

/* dialog */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:10;
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{background:var(--ivory);width:min(580px,calc(100% - 14px));max-height:calc(100% - 14px);display:flex;flex-direction:column;
  border:3px solid var(--ink);box-shadow:0 0 0 4px var(--wood),0 0 0 7px var(--ink),0 14px 0 7px rgba(0,0,0,.22)}
.panel.wide{width:min(820px,calc(100% - 14px))}
.ph{background:var(--wood);border-bottom:3px solid var(--ink);box-shadow:inset 0 2px 0 var(--wood-light);display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px}
.ph h2{margin:0;flex:1;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--ivory);text-shadow:0 2px 0 var(--ink);text-wrap:balance}
.x{background:var(--ivory);border:2px solid var(--ink);width:32px;height:32px;font-family:var(--f-pixel);font-size:14px;line-height:1;box-shadow:0 2px 0 var(--ink)}
.pb{padding:18px 20px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px;min-height:0;line-height:1.65;font-size:15px}
.pb p{margin:0;max-width:62ch}
.pb h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--moss-dark)}
.lead{font-family:var(--f-story);font-size:17px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.btn{font-family:var(--f-display);font-size:16px;background:var(--moss);color:var(--ivory);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:8px 16px}
.btn:hover{background:#5a8c51}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--ivory);color:var(--ink)}
.btn.ghost:hover{background:var(--ivory-2)}
.btn.warn{background:var(--alert)}
.btn.small{font-size:14px;padding:5px 11px}
.link{background:none;border:none;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}
.box{border:2px solid var(--ink);background:#fffaf0;padding:12px 14px}
.box.soft{border-style:dashed;border-color:var(--wood);background:transparent}
.box.alert{border-color:var(--alert);background:#fbe9e1}
.box.amber{border-color:var(--amber);background:#fbf0d6}
label.fl{font-family:var(--f-display);font-size:15px;display:block;margin-bottom:6px}
input[type=text],textarea{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--text);background:#fffdf6;border:2px solid var(--ink);padding:9px 11px;box-shadow:inset 0 2px 0 var(--ivory-2)}
textarea{font-family:var(--f-story);line-height:1.7;resize:vertical;min-height:150px}
.count{font-family:var(--f-pixel);font-size:10px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.emos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:480px){ .emos{grid-template-columns:repeat(2,minmax(0,1fr))} }
.emo{position:relative}
.emo input{position:absolute;opacity:0;inset:0}
.emo label{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--ink);background:#fffaf0;padding:8px 4px 8px;cursor:pointer;text-align:center;height:100%;box-sizing:border-box}
.emo canvas{width:40px;height:52px;image-rendering:pixelated}
.emo b{font-family:var(--f-display);font-weight:400;font-size:16px}
.emo small{font-size:11px;color:var(--muted);line-height:1.3}
.emo input:checked+label{background:#e3eed6;box-shadow:inset 0 0 0 3px var(--moss)}
.emo input:focus-visible+label{outline:3px solid var(--amber);outline-offset:2px}
.vis{display:grid;gap:6px}
.vis label{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--ink);background:#fffaf0;padding:9px 12px;cursor:pointer}
.vis input{margin-top:5px;accent-color:var(--moss)}
.vis b{font-family:var(--f-display);font-weight:400}
.vis span{display:block;font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;border:1.5px solid var(--ink);padding:1px 8px;background:var(--ivory-2);white-space:nowrap}
.chip.moss{background:#dbe9cf}.chip.amber{background:#f6e2b5}.chip.alert{background:#f3cfc2}.chip.gray{background:#e8e2d6;color:var(--muted)}
.story{font-family:var(--f-story);font-size:17px;line-height:1.85;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.stitle{font-family:var(--f-display);font-size:21px;margin:0;text-wrap:balance}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;border:2px solid var(--ink);background:#fffaf0;padding:8px 12px;text-align:left;width:100%}
.item:hover{background:var(--ivory-2)}
.item canvas{width:24px;height:31px;image-rendering:pixelated;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{font-family:var(--f-display);font-weight:400;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{font-size:12px;color:var(--muted)}
.card{border:2px solid var(--ink);background:#fffaf0;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card .story{font-size:15px;line-height:1.7;max-height:12em;overflow:auto}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:3px solid var(--ink)}
.tab{font-family:var(--f-display);font-size:15px;background:var(--ivory-2);border:2px solid var(--ink);border-bottom:none;padding:6px 12px}
.tab[aria-selected=true]{background:var(--wood-light)}
.lines{display:grid;gap:10px}
.line{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.line .num{font-family:var(--f-display);font-size:20px;color:var(--alert);font-variant-numeric:tabular-nums;white-space:nowrap}
.breath{width:150px;height:150px;margin:6px auto;border:3px solid var(--ink);border-radius:50%;background:radial-gradient(circle,#e3eed6 0 40%,#bcd6a8 70%);display:grid;place-items:center;font-family:var(--f-display);font-size:16px;color:var(--moss-dark);transform:scale(.7)}
.breath.on{animation:breath 10s ease-in-out infinite}
@keyframes breath{0%{transform:scale(.7)}40%{transform:scale(1)}50%{transform:scale(1)}100%{transform:scale(.7)}}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px solid var(--ink);background:#fffaf0;padding:9px 12px}
.toggle b{font-family:var(--f-display);font-weight:400}
.toggle button[aria-pressed=true]{background:var(--moss);color:var(--ivory)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){ .grid2{grid-template-columns:1fr} }
.av{display:flex;gap:10px;flex-wrap:wrap}
.av label{border:2px solid var(--ink);background:#fffaf0;padding:6px 10px;display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative}
.av input{position:absolute;opacity:0}
.av canvas{width:36px;height:45px;image-rendering:pixelated}
.av input:checked+canvas{outline:3px solid var(--moss);outline-offset:3px}
.rules{margin:0;padding-left:1.2em;display:grid;gap:4px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){ .breath.on{animation:none;transform:scale(.85)} }
</style>

<div id="app">
  <header class="bar">
    <div class="brand"><canvas id="logo" width="20" height="26" aria-hidden="true"></canvas><div><h1>마음의 숲</h1><span>FOREST OF US</span></div></div>
    <nav aria-label="숲 공간">
      <button class="nb" data-go="plant" type="button">마음 심기</button>
      <button class="nb" data-go="mine" type="button">나의 나무</button>
      <button class="nb" data-go="rest" type="button">고요한 쉼터</button>
      <button class="nb" data-go="lab" type="button">숲 연구소</button>
      <button class="nb" data-go="guide" type="button">숲 입구 안내</button>
      <button class="nb" data-go="admin" type="button" id="adminBtn" hidden>운영실<b id="adminBadge" hidden></b></button>
    </nav>
  </header>
  <main class="stage">
    <canvas id="world" tabindex="0" aria-label="픽셀 숲 지도. 방향키나 WASD로 걷고, 나무를 눌러 이야기를 읽어요."></canvas>
    <div class="plaque hud" id="hud" aria-live="polite"><strong>숲을 불러오는 중</strong></div>
    <div class="plaque keys"><kbd>WASD</kbd> 걷기 · <kbd>SPACE</kbd> 살펴보기 · 클릭하면 그곳으로 걸어가요</div>
    <button class="help" id="supportBtn" type="button">도움이 필요할 때</button>
    <div class="plaque toast" id="toast" hidden></div>
  </main>
</div>
<div class="scrim" id="scrim" hidden>
  <section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle">
    <div class="ph"><h2 id="ptitle"></h2><button class="x" id="pclose" type="button" aria-label="닫기">X</button></div>
    <div class="pb" id="pbody"></div>
  </section>
</div>

<script>
(() => {
"use strict";
/* ===================== constants ===================== */
const W = 48, H = 34, T = 16;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const EMO = {
  tired:   { ko:'지침',  tree:'작은 소나무', desc:'조용하고 단정한 형태' },
  anxious: { ko:'불안',  tree:'푸른 잎 나무', desc:'부드러운 잎 형태' },
  lonely:  { ko:'외로움', tree:'버드나무',   desc:'아래로 흐르는 가지' },
  hope:    { ko:'희망',  tree:'꽃나무',     desc:'작은 꽃이 피어난 형태' },
};
const STATUS = {
  private:{t:'나만 보기',c:'gray'}, pending:{t:'공개 검토 중',c:'amber'}, approved:{t:'숲에 공개됨',c:'moss'},
  held:{t:'수정 요청',c:'alert'}, kept_private:{t:'비공개로 유지됨',c:'gray'}, hidden:{t:'숲에서 숨겨짐',c:'gray'},
  delete_requested:{t:'삭제 요청됨',c:'gray'}
};
const month = new Date().getMonth() + 1;
const SEASON = month>=3&&month<=5 ? 'spring' : month>=6&&month<=8 ? 'summer' : month>=9&&month<=11 ? 'autumn' : 'winter';
const SEASON_KO = {spring:'봄',summer:'여름',autumn:'가을',winter:'겨울'}[SEASON];
const GRASS = {
  spring:['#8fcb68','#7dbb5b','#a2d77b','#6aa64f'], summer:['#6fbb54','#5fa948','#82c865','#4f9440'],
  autumn:['#a9bf5c','#97ad50','#bccc6c','#83993f'], winter:['#cfd9c8','#c0cbb9','#dde5d8','#adb9a8']
}[SEASON];

/* ===================== tiny helpers ===================== */
const $ = s => document.querySelector(s);
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})){
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const ls = { get(k,d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch{ return d; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} } };
const monthLabel = ms => { const d = new Date(ms||Date.now()); return `${d.getFullYear()}년 ${d.getMonth()+1}월`; };
const deepMerge = (a,b) => { const o = {...(a||{})}; for (const [k,v] of Object.entries(b)){ o[k] = (v && typeof v==='object' && !Array.isArray(v)) ? deepMerge(o[k], v) : v; } return o; };
const clone = o => JSON.parse(JSON.stringify(o||{}));

/* ===================== text checks ===================== */
const CHECKS = {
  personal: [/01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}/, /[\w.+-]+@[\w-]+\.[\w.]+/, /\d{6}\s?-\s?[1-4]\d{6}/,
             /(카톡|카카오톡|오픈채팅|텔레그램|인스타)\s?(아이디|id|ID)?\s?[:：]?\s?[A-Za-z0-9_.]{3,}/,
             /[가-힣A-Za-z]{2,12}(병원|의원|클리닉|산부인과|여성병원)/, /https?:\/\//],
  crisis:   [/죽고\s*싶/, /자살/, /자해/, /사라지고\s*싶/, /살고\s*싶지\s*않/, /살기\s*싫/, /끝내고\s*싶/, /극단적/, /목숨/],
  advice:   [/(꼭|무조건)\s*(드세요|드셔|먹어|하세요)/, /효과\s*(있어|봤|최고|짱)/, /(약|한약|영양제|주사).{0,8}(추천|드세요|좋아요)/],
};
function checkText(s){ const f = []; for (const [k,arr] of Object.entries(CHECKS)) if (arr.some(r => r.test(s))) f.push(k); return f; }
const FLAG_KO = { personal:'개인정보 의심', crisis:'위기 표현', advice:'의료 조언 의심' };

/* ===================== pixel sprites ===================== */
function mk(w,h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function Grid(w,h){ this.w=w; this.h=h; this.a=new Array(w*h).fill(null); }
Grid.prototype.set = function(x,y,c){ if (x>=0&&y>=0&&x<this.w&&y<this.h&&c) this.a[y*this.w+x]=c; };
Grid.prototype.get = function(x,y){ return (x>=0&&y>=0&&x<this.w&&y<this.h) ? this.a[y*this.w+x] : null; };
Grid.prototype.canvas = function(){ const c = mk(this.w,this.h), g = c.getContext('2d'); for (let y=0;y<this.h;y++) for (let x=0;x<this.w;x++){ const v=this.a[y*this.w+x]; if (v){ g.fillStyle=v; g.fillRect(x,y,1,1);} } return c; };
function paintShape(G, inside, shade, outline){
  for (let y=0;y<G.h;y++) for (let x=0;x<G.w;x++){
    if (!inside(x,y)) continue;
    const edge = !inside(x-1,y)||!inside(x+1,y)||!inside(x,y-1)||!inside(x,y+1);
    G.set(x,y, edge ? outline : shade(x,y));
  }
}
function trunk(G, wide, col='#7a4f2c', dark='#55361c', out='#3b2614'){
  const x0 = wide ? 8 : 9, x1 = wide ? 11 : 10;
  for (let y=16;y<26;y++){ for (let x=x0;x<=x1;x++) G.set(x,y, x===x1?dark:col); G.set(x0-1,y,out); G.set(x1+1,y,out); }
  G.set(x0-2,25,out); G.set(x1+2,25,out); G.set(x0-1,25,dark); G.set(x1+1,25,dark);
}
function blobInside(circles, maxY=99){ return (x,y) => y<=maxY && circles.some(([cx,cy,r]) => (x-cx)**2+(y-cy)**2 <= r*r); }
function blobShade(pal, cx, cy, r){ return (x,y) => { const dl = (x-(cx-3))**2+(y-(cy-3))**2; if (dl < (r*.5)**2) return pal.l; if ((x-cx)+(y-cy) > r*.75) return pal.d; return pal.m; }; }

function pineSprite(pal, snow){
  const G = new Grid(20,26); trunk(G,false);
  const tiers = [{y0:1,h:7,w:3},{y0:5,h:8,w:5},{y0:10,h:10,w:8}], cx = 10;
  const tierAt = (x,y) => { let hit=null; for (const t of tiers){ if (y>=t.y0 && y<t.y0+t.h){ const half = 1+Math.floor((y-t.y0)*t.w/(t.h-1)); if (x>=cx-half && x<cx+half) hit={t,half}; } } return hit; };
  paintShape(G, (x,y)=>!!tierAt(x,y), (x,y)=>{ const {t,half}=tierAt(x,y); const ry=y-t.y0;
    if (snow && ry<=1) return '#f2f5f7';
    if (x < cx-1 && x >= cx-half+1 && ry < t.h*.7) return pal.l; if (x > cx+1 || ry >= t.h-2) return pal.d; return pal.m; }, pal.o);
  return G.canvas();
}
function blobSprite(pal){
  const G = new Grid(20,26); trunk(G,false);
  const cs = [[10,9,7.4],[5.5,12,4.6],[14.5,12,4.6],[10,13,5.5]];
  paintShape(G, blobInside(cs,17), blobShade(pal,10,10,7.4), pal.o);
  // soft leaf tufts
  for (const [x,y] of [[6,8],[12,5],[14,10],[8,13],[11,15]]) G.set(x,y,pal.l);
  return G.canvas();
}
function willowSprite(pal){
  const G = new Grid(20,26); trunk(G,false);
  const cs = [[10,7,6.6],[5,9,4],[15,9,4]];
  paintShape(G, blobInside(cs,12), blobShade(pal,10,7,6.6), pal.o);
  for (let x=2;x<=18;x++){
    if (x%2===0 && x!==10) continue;
    const len = 5 + ((x*7)%5); const top = 10;
    for (let y=top; y<top+len && y<24; y++){ if (G.get(x,y)===pal.o && y<12) continue; G.set(x,y, y===top+len-1 ? pal.l : (x%4===1?pal.m:pal.d)); }
  }
  return G.canvas();
}
function blossomSprite(pal){
  const G = new Grid(20,26); trunk(G,false);
  const cs = [[10,9,7],[5,12,4.4],[15,12,4.4],[10,13,5]];
  const ins = blobInside(cs,17);
  paintShape(G, ins, blobShade(pal,10,9,7), pal.o);
  for (let y=0;y<26;y++) for (let x=0;x<20;x++){
    if (!ins(x,y) || G.get(x,y)===pal.o) continue;
    const k = (x*13 + y*7) % 11;
    if (k===0) G.set(x,y,'#f4a6bf'); else if (k===5 && y<14) G.set(x,y,'#fff0f4');
  }
  return G.canvas();
}
function oakSprite(pal){

function charSprite(av, rows, frame, flip){
  const G = new Grid(12,15);
  const pal = {h:av.hair, s:'#f1c7a0', e:'#2b2118', b:'#e8977d', c:av.shirt, p:av.pants, o:'#3b2a20'};
  const r = rows.slice();
  if (frame===1){ r[11] = r[11].replace('pp..pp','.pp.pp.').slice(0,10); r[12] = r[12].replace('oo..oo','.oo.oo.').slice(0,10); }
  r.forEach((row,y) => [...row].forEach((ch,x) => { if (ch!=='.') G.set((flip?9-x:x)+1, y+1, pal[ch]); }));
  const out = new Grid(12,15);
  for (let y=0;y<15;y++) for (let x=0;x<12;x++){
    const v = G.get(x,y); if (v){ out.set(x,y,v); continue; }
    if (G.get(x-1,y)||G.get(x+1,y)||G.get(x,y-1)||G.get(x,y+1)) out.set(x,y,'#2b2118');
  }

}
function buildChar(i){
  const av = AVATARS[i] || AVATARS[0];

  return S;
}

/* ===================== world generation ===================== */
const ground = new Uint8Array(W*H); // 0 grass 1 path 2 water 3 soil
const block = new Uint8Array(W*H);
const idx = (x,y) => y*W+x;
const inb = (x,y) => x>=0&&y>=0&&x<W&&y<H;
const PATHS = [
  [[24,33],[24,26],[23,21],[23,17]],
  [[23,17],[18,18],[13,16],[11,13]],
  [[23,17],[29,18],[35,15],[38,11],[38,10]],
  [[23,17],[21,13],[25,9],[23,5],[24,2]],
  [[21,24],[24,24]],
];
for (const pl of PATHS) for (let i=0;i<pl.length-1;i++){
  const [ax,ay]=pl[i],[bx,by]=pl[i+1], n = Math.ceil(Math.hypot(bx-ax,by-ay)*4);
  for (let s=0;s<=n;s++){ const x=Math.round(ax+(bx-ax)*s/n), y=Math.round(ay+(by-ay)*s/n);
    for (const [dx,dy] of [[0,0],[1,0],[0,1],[1,1]]) if (inb(x+dx,y+dy)) ground[idx(x+dx,y+dy)]=1; }
}
// pond
const POND = {cx:7.5, cy:9.5, rx:3.6, ry:2.7};
for (let y=0;y<H;y++) for (let x=0;x<W;x++){ if (((x+.5-POND.cx)/POND.rx)**2+((y+.5-POND.cy)/POND.ry)**2<=1){ ground[idx(x,y)]=2; block[idx(x,y)]=1; } }
// planting patch
const PATCH = {x0:14,y0:21,x1:22,y1:28};
const fences = [];
for (let y=PATCH.y0;y<=PATCH.y1;y++) for (let x=PATCH.x0;x<=PATCH.x1;x++){
  const edge = x===PATCH.x0||x===PATCH.x1||y===PATCH.y0||y===PATCH.y1;
  if (edge){ if (ground[idx(x,y)]===1) continue; fences.push([x,y]); block[idx(x,y)]=1; }
  else ground[idx(x,y)]=3;
}
const PATCH_SLOTS = []; for (const y of [24,26,22]) for (const x of [15,17,19,21]) PATCH_SLOTS.push([x,y]);
for (const [x,y] of [[16,23],[18,23],[20,23],[16,25],[18,25],[20,25],[16,27],[18,27],[20,27]]) PATCH_SLOTS.push([x,y]);
// cabin
const CABIN = {x0:37,y0:6,x1:41,y1:9, door:[39,10]};
for (let y=CABIN.y0;y<=CABIN.y1;y++) for (let x=CABIN.x0;x<=CABIN.x1;x++) block[idx(x,y)]=1;

const isPath = (x,y) => inb(x,y) && ground[idx(x,y)]===1;
const nearPath = (x,y) => { for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++) if (isPath(x+dx,y+dy)) return true; return false; };
const inRect = (x,y,[a,b,c,d]) => x>=a&&x<=c&&y>=b&&y<=d;
const ZONES_OFF = [[13,20,23,29],[2,4,13,14],[35,4,43,11],[20,29,28,33]];
function freeNear(x0,y0){
  for (let r=0;r<6;r++) for (let dy=-r;dy<=r;dy++) for (let dx=-r;dx<=r;dx++){
    const x=x0+dx,y=y0+dy; if (!inb(x,y)) continue;
    if (ground[idx(x,y)]===0 && !block[idx(x,y)]) return [x,y];
  }
  return [x0,y0];
}
// props
const SIGNS = [
  {label:'마음 심는 터', go:'plant', at:freeNear(23,22)},
  {label:'이야기 숲길', go:'path', at:freeNear(26,15)},
  {label:'고요한 쉼터', go:'rest', at:freeNear(13,12)},
  {label:'숲 연구소', go:'lab', at:freeNear(36,12)},
];
SIGNS.forEach(s => block[idx(...s.at)] = 1);
const BENCH = freeNear(11,12); block[idx(...BENCH)] = 1;
const LANTERN = freeNear(12,9); block[idx(...LANTERN)] = 1;
const ARCH = [[22,31],[27,31]]; ARCH.forEach(a=>block[idx(...a)]=1);

// story slots & stages
const stageOf = (x,y) => (x>=13&&x<=35&&y>=12&&y<=21) ? 1 : (x>=13&&x<=35&&y>=3&&y<=11) ? 2 : 3;
const STAGE_FOG = {2:[[13,3,35,11]], 3:[[2,15,12,31],[36,12,45,31],[26,22,35,31]]};
const STAGE_NAME = {1:'1단계 · 작은 숲',2:'2단계 · 이야기 숲',3:'3단계 · 함께하는 숲'};
let SLOTS = [];
for (let y=3;y<=30;y+=2) for (let x=3 + ((y/2)%2); x<=44; x+=3){
  if (!inb(x,y) || ground[idx(x,y)]!==0 || block[idx(x,y)] || nearPath(x,y)) continue;
  if (ZONES_OFF.some(z=>inRect(x,y,z))) continue;
  if (SIGNS.some(s=>Math.abs(s.at[0]-x)<=1&&Math.abs(s.at[1]-y)<=1)) continue;
  SLOTS.push({x,y,stage:stageOf(x,y)});
}
SLOTS.sort((a,b)=> a.stage-b.stage || (Math.hypot(a.x-24,a.y-17) - Math.hypot(b.x-24,b.y-17)));
const STAGE_CAP = {1:SLOTS.filter(s=>s.stage===1).length};
STAGE_CAP[2] = STAGE_CAP[1] + SLOTS.filter(s=>s.stage===2).length;
const slotSet = new Set(SLOTS.map(s=>idx(s.x,s.y)));
// wild trees
const R = rng(20261015);
const wild = [];
for (let y=0;y<H;y++) for (let x=0;x<W;x++){
  const border = x<2||x>W-3||y<2||y>H-3;
  const gate = x>=22&&x<=27&&y>=29;
  let place = false;
  if (border && !gate && !isPath(x,y)) place = (x+y)%2===0 || R()<.5;
  else if (!border && ground[idx(x,y)]===0 && !block[idx(x,y)] && !nearPath(x,y) && !slotSet.has(idx(x,y))){
    let nearSlot=false; for (const s of SLOTS) if (Math.abs(s.x-x)<=1&&Math.abs(s.y-y)<=1){ nearSlot=true; break; }
    if (!nearSlot && !ZONES_OFF.slice(0,1).some(z=>inRect(x,y,z)) && !inRect(x,y,[20,28,29,33]) && !inRect(x,y,[34,4,44,12])){
      const p = inRect(x,y,[2,4,13,14]) ? .1 : .14; place = R() < p;
    }
  }
  if (place){ wild.push({x,y,spr:WILD[Math.floor(R()*WILD.length)]}); block[idx(x,y)]=1; }
}
const waterTiles = []; for (let y=0;y<H;y++) for (let x=0;x<W;x++) if (ground[idx(x,y)]===2) waterTiles.push([x,y]);

/* ground canvas */
const groundCv = mk(W*T,H*T);
(() => {
  const g = groundCv.getContext('2d'), r = rng(7);
  const PATHC = SEASON==='winter' ? ['#d9ccb4','#c6b69b','#e6dbc6','#b8a78a'] : ['#cfa86c','#b9925a','#dfbd85','#a8834f'];
  for (let ty=0;ty<H;ty++) for (let tx=0;tx<W;tx++){
    const X=tx*T, Y=ty*T, gt = ground[idx(tx,ty)];
    if (gt===0 || gt===2){
      g.fillStyle=GRASS[0]; g.fillRect(X,Y,T,T);
      for (let i=0;i<10;i++){ g.fillStyle=GRASS[1+Math.floor(r()*3)]; g.fillRect(X+Math.floor(r()*T),Y+Math.floor(r()*T),1,1); }
      if (r()<.35){ const x=X+2+Math.floor(r()*12), y=Y+3+Math.floor(r()*10); g.fillStyle=GRASS[3]; g.fillRect(x,y,1,2); g.fillRect(x+2,y-1,1,3); g.fillStyle=GRASS[2]; g.fillRect(x+1,y,1,2); }
      const deco = r();
      if (deco<.07){ const fl = {spring:['#f6b7cf','#fff3f6'],summer:['#f4d35e','#ffffff'],autumn:['#e3893a','#c9592e'],winter:['#ffffff','#f1f4f7']}[SEASON];
        const x=X+3+Math.floor(r()*10), y=Y+3+Math.floor(r()*10); g.fillStyle=fl[0]; g.fillRect(x,y,2,1); g.fillRect(x,y+1,1,1); g.fillStyle=fl[1]; g.fillRect(x+1,y+1,1,1); }
    }
    if (gt===1){
      g.fillStyle=PATHC[0]; g.fillRect(X,Y,T,T);
      for (let i=0;i<9;i++){ g.fillStyle=PATHC[1+Math.floor(r()*3)]; g.fillRect(X+Math.floor(r()*T),Y+Math.floor(r()*T),1+(r()<.3),1); }
      g.fillStyle=PATHC[3];
      if (!isPath(tx-1,ty)) g.fillRect(X,Y,1,T); if (!isPath(tx+1,ty)) g.fillRect(X+T-1,Y,1,T);
      if (!isPath(tx,ty-1)) g.fillRect(X,Y,T,1); if (!isPath(tx,ty+1)) g.fillRect(X,Y+T-1,T,1);
    }
    if (gt===3){
      g.fillStyle='#8a5a35'; g.fillRect(X,Y,T,T);
      for (let yy=0;yy<T;yy+=4){ g.fillStyle='#6f4528'; g.fillRect(X,Y+yy+3,T,1); g.fillStyle='#a06d42'; g.fillRect(X,Y+yy,T,1); }
      for (let i=0;i<4;i++){ g.fillStyle='#5e3a21'; g.fillRect(X+Math.floor(r()*T),Y+Math.floor(r()*T),1,1); }
    }
  }
  // water drawn over grass
  for (const [tx,ty] of waterTiles){
    const X=tx*T, Y=ty*T;
    g.fillStyle='#5b9fc6'; g.fillRect(X,Y,T,T);
    const land = (x,y) => !inb(x,y) || ground[idx(x,y)]!==2;
    g.fillStyle='#e3d19c';
    if (land(tx-1,ty)) g.fillRect(X,Y,2,T); if (land(tx+1,ty)) g.fillRect(X+T-2,Y,2,T);
    if (land(tx,ty-1)) g.fillRect(X,Y,T,2); if (land(tx,ty+1)) g.fillRect(X,Y+T-2,T,2);
    g.fillStyle='#427fa7';
    if (land(tx,ty-1)) g.fillRect(X+(land(tx-1,ty)?2:0),Y+2,T-(land(tx-1,ty)?2:0)-(land(tx+1,ty)?2:0),2);
  }
  // lily pads
  for (const [x,y] of [[6,9],[9,10],[5,10]]){ g.fillStyle='#4f8b47'; g.fillRect(x*T+4,y*T+6,6,4); g.fillStyle='#6fae5d'; g.fillRect(x*T+5,y*T+6,3,2); }
})();

}

  for (const s of SIGNS) entities.push({kind:'sign', x:s.at[0]*T+8, y:s.at[1]*T+14, spr:SIGN_SPR, use:s.go, label:s.label});
  entities.push({kind:'bench', x:BENCH[0]*T+8, y:BENCH[1]*T+12, spr:BENCH_SPR, use:'rest'});

    entities.push({kind:'story', x:t.x*T+8, y:t.y*T+14, spr:SPR[t.emotion], tree:t, mine:mineIds.has(t.id), use:'read'});

/* ===================== player & movement ===================== */

const keys = new Set();
function blockedPx(px,py){ return isBlocked(Math.floor(px/T), Math.floor(py/T)); }

function tryMove(dx,dy){
  const stuck = hitAt(player.x,player.y);
  if (dx && (stuck || !hitAt(player.x+dx,player.y))) player.x += dx;
  if (dy && (stuck || !hitAt(player.x,player.y+dy))) player.y += dy;
  player.x = Math.max(8, Math.min(W*T-8, player.x)); player.y = Math.max(8, Math.min(H*T-4, player.y));

function bfs(goals){
  const sx = Math.floor(player.x/T), sy = Math.floor(player.y/T);
  const goal = new Set(goals.filter(([x,y])=>inb(x,y)&&!isBlocked(x,y)).map(([x,y])=>idx(x,y)));
  if (!goal.size) return null;
  const prev = new Int32Array(W*H).fill(-2); prev[idx(sx,sy)] = -1;
  const q = [idx(sx,sy)];
  while (q.length){
    const c = q.shift();
    if (goal.has(c)){ const p=[]; let k=c; while (k!==-1){ p.unshift([k%W, Math.floor(k/W)]); k=prev[k]; } return p; }
    const cx=c%W, cy=Math.floor(c/W);

}

const cv = $('#world'), ctx = cv.getContext('2d');

const plantAnim = { id:null, x:0, y:0, emo:'tired', t0:0 };

let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;

  requestAnimationFrame(frame);
}
function update(dt, now){
  if (panelOpen()) { player.moving=false; return; }
  let dx=0, dy=0;
  if (keys.has('ArrowLeft')||keys.has('a')) dx-=1;
  if (keys.has('ArrowRight')||keys.has('d')) dx+=1;
  if (keys.has('ArrowUp')||keys.has('w')) dy-=1;
  if (keys.has('ArrowDown')||keys.has('s')) dy+=1;
  const sp = 72*dt;
  if (dx||dy){ player.path=null; player.onArrive=null; const l=Math.hypot(dx,dy); tryMove(dx/l*sp, dy/l*sp); player.dir = Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'); player.moving=true; cam.focus=null; }
  else if (player.path && player.path.length){
    const [tx,ty] = player.path[0], gx = tx*T+8, gy = ty*T+10;
    const ddx = gx-player.x, ddy = gy-player.y, d = Math.hypot(ddx,ddy);
    if (d <= sp){ player.x=gx; player.y=gy; player.path.shift(); if (!player.path.length){ player.path=null; const f=player.onArrive; player.onArrive=null; f && f(); } }
    else { player.x += ddx/d*sp; player.y += ddy/d*sp; }
    player.dir = Math.abs(ddx)>Math.abs(ddy)?(ddx>0?'right':'left'):(ddy>0?'down':'up'); player.moving=true; cam.focus=null;
  } else player.moving=false;

}
function camOrigin(){
  const ww=W*T, wh=H*T;
  let ox = ww<=VW ? (ww-VW)/2 : Math.max(0, Math.min(ww-VW, cam.x-VW/2));
  let oy = wh<=VH ? (wh-VH)/2 : Math.max(0, Math.min(wh-VH, cam.y-VH/2));

}
function nearestUse(){
  let best=null, bd=26;

}
function draw(now){
  const t = now/1000;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#20361f'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.imageSmoothingEnabled = false;

  ctx.setTransform(SC,0,0,SC,-ox*SC,-oy*SC);
  ctx.drawImage(groundCv, 0, 0);
  // water shimmer
  ctx.fillStyle = 'rgba(200,232,246,.7)';
  for (const [x,y] of waterTiles){ const p = REDUCED?0:Math.floor((t*6 + x*5 + y*3) % 14); if ((x+y)%2) ctx.fillRect(x*T+1+p%12, y*T+5+((x*7)%6), 3, 1); }

function tag(x,y,text,fs,fg,bg){
  const w = ctx.measureText(text).width + fs*1.1, hgt = fs*1.6, b = Math.max(2, Math.round(fs/7));
  ctx.fillStyle='#2b2118'; ctx.fillRect(Math.round(x-w/2-b), Math.round(y-hgt/2-b), Math.round(w+b*2), Math.round(hgt+b*2));
  ctx.fillStyle=bg; ctx.fillRect(Math.round(x-w/2), Math.round(y-hgt/2), Math.round(w), Math.round(hgt));
  ctx.fillStyle=fg; ctx.fillText(text, x, y+1);
}
function drawPlayer(){
  ctx.fillStyle='rgba(25,40,18,.3)'; ctx.beginPath(); ctx.ellipse(player.x, player.y+1, 5, 2, 0, 0, 6.29); ctx.fill();
  const spr = CHAR[player.dir + (REDUCED?0:player.frame)];
  ctx.drawImage(spr, Math.round(player.x-6), Math.round(player.y-14));
}
function drawPlant(now){
  const e = (now - plantAnim.t0)/1000, x = plantAnim.x, y = plantAnim.y;
  if (e < .5){ const yy = y - 34*(1-e/.5); ctx.fillStyle='#2b2118'; ctx.fillRect(x-2,yy-3,4,4); ctx.fillStyle='#c9902f'; ctx.fillRect(x-1,yy-2,2,2); }
  else if (e < .85){ ctx.drawImage(SPR.sap[0], x-10, y-24); const k=(e-.5)/.35; ctx.fillStyle=`rgba(160,120,80,${1-k})`; for (let i=0;i<6;i++){ const a=i/6*6.28; ctx.fillRect(x+Math.cos(a)*k*9, y-2+Math.sin(a)*k*4, 2, 2);} }
  else if (e < 1.2) ctx.drawImage(SPR.sap[1], x-10, y-24);
  else if (e < 1.55) ctx.drawImage(SPR.sap[2], x-10, y-24);
  else if (e < 2.3){
    const k = Math.min(1,(e-1.55)/.35), s = k<1 ? .55+.55*k : 1 + .06*Math.sin((e-1.9)*14)*Math.max(0,1-(e-1.9)/.4);
    const spr = SPR[plantAnim.emo]; const w=20*s, hh=26*s;
    ctx.drawImage(spr, Math.round(x-w/2), Math.round(y+2-hh), Math.round(w), Math.round(hh));
    ctx.fillStyle='#fbf3df'; for (let i=0;i<8;i++){ const a=i/8*6.28 + e; const r=10+ (e-1.55)*14; ctx.fillRect(Math.round(x+Math.cos(a)*r), Math.round(y-12+Math.sin(a)*r*.7), 2, 2); }
  } else { plantAnim.id = null; }
}

/* ===================== input on canvas ===================== */
addEventListener('keydown', e => {
  if (panelOpen()){ if (e.key==='Escape') closePanel(); return; }
  if (e.target.closest && e.target.closest('input,textarea,button,nav')) { if (e.target!==cv) return; }
  const k = e.key.length===1 ? e.key.toLowerCase() : e.key;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','w','a','s','d'].includes(k)){ keys.add(k); e.preventDefault(); }
  if (k===' '||k==='Enter'||k==='e'){ const n = nearestUse(); if (n){ e.preventDefault(); useEntity(n); } }
});
addEventListener('keyup', e => { const k = e.key.length===1 ? e.key.toLowerCase() : e.key; keys.delete(k); });
addEventListener('blur', () => keys.clear());
cv.addEventListener('pointerdown', e => {
  if (panelOpen()) return;
  cv.focus({preventScroll:true});
  const r = cv.getBoundingClientRect(); const [ox,oy] = camOrigin();
  const wx = ox + (e.clientX-r.left)*DPR/SC, wy = oy + (e.clientY-r.top)*DPR/SC;
  // hit test from front to back
  const cands = entities.filter(en=>en.use).sort((a,b)=>b.y-a.y);
  for (const en of cands){
    const box = en.hit || (en.kind==='sign' ? [en.x-8,en.y-17,en.x+8,en.y+2] : en.kind==='bench' ? [en.x-9,en.y-12,en.x+9,en.y+2] : [en.x-9,en.y-24,en.x+9,en.y+2]);
    if (wx>=box[0]&&wx<=box[2]&&wy>=box[1]&&wy<=box[3]){
      const tx = Math.floor((en.ux??en.x)/T), ty = Math.floor((en.uy??en.y)/T);
      const goals = (en.ux!=null) ? [[tx,ty],...around(tx,ty)] : around(tx,ty);
      walkTo(goals, () => { player.dir = player.y > (en.uy??en.y) ? 'up' : 'down'; useEntity(en); });
      return;
    }
  }
  const tx = Math.floor(wx/T), ty = Math.floor(wy/T);
  if (!inb(tx,ty)) return;
  walkTo(isBlocked(tx,ty) ? around(tx,ty) : [[tx,ty]]);
});
function useEntity(en){
  if (en.use==='read') openRead(en.tree, en.kind==='mytree' || en.mine);
  else if (en.use==='path') toast('공개된 나무 앞에 서면 익명의 이야기를 읽을 수 있어요.');
  else go(en.use);
}

async function saveTree(d, edit){
  const flags = checkText(d.title+' '+d.body);
  const id = edit ? edit.id : newId();
  const createdAt = edit ? (edit.createdAt||Date.now()) : Date.now();
  const before = patchTrees().length;
  if (d.vis==='private'){
    await S.setMine(id, {emotion:d.emotion, title:d.title, body:d.body, createdAt});
    if (edit && edit.kind==='queue') await removeQueueItem(id);
  } else {
    await S.myQueueMerge({items:{[id]:{emotion:d.emotion, title:d.title, body:d.body, submittedAt:createdAt, state:'pending', flags, note:null}}});
    if (edit && edit.kind==='private') await S.delMine(id);
  }
  closePanel();
  if (edit){ toast(d.vis==='public' ? '고친 내용으로 다시 공개 검토를 신청했어요.' : '고친 내용을 저장했어요.'); return; }
  ls.set('forest.draft', {emo:'tired',title:'',body:'',vis:'private'});
  const [sx,sy] = PATCH_SLOTS[before % PATCH_SLOTS.length];
  Object.assign(plantAnim, {id, x:sx*T+8, y:sy*T+14, emo:d.emotion, t0:performance.now() + 450});
  cam.focus = {x:sx*T+8, y:sy*T+6};
  setTimeout(() => {
    if (flags.includes('crisis')) openSupport(true);
    else openPanel('planted','나무가 심어졌어요',[
      h('p',{class:'lead',text:'당신의 이야기가 작은 나무로 남았습니다.'}),
      d.vis==='public' ? h('p',{text:'공개를 신청한 나무는 운영자가 확인한 뒤 이야기 숲길로 옮겨 심어져요. 그전까지는 마음 심는 터에서 나만 볼 수 있어요.'}) : h('p',{text:'이 나무는 마음 심는 터에서 나만 볼 수 있어요. 나의 나무에서 언제든 다시 읽거나 지울 수 있어요.'}),
      h('p',{class:'muted',text:'숲과 마음의 관계가 궁금하다면, 산림복지 연구 이야기도 살펴보세요.'}),

  }, REDUCED ? 600 : 2900);
}

      h('p',{class:'muted',style:'margin-top:4px',text: `${monthLabel(t.createdAt || t.approvedAt)}에 심은 나무`})));

const audio = { ctx:null, nodes:{}, on:{wind:false,birds:false,leaves:false} };
function ensureAudio(){
  if (audio.ctx) return audio.ctx;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
  const c = new AC(); audio.ctx = c;
  const buf = c.createBuffer(1, c.sampleRate*2, c.sampleRate), d = buf.getChannelData(0);
  let b=0; for (let i=0;i<d.length;i++){ b = (b + .02*(Math.random()*2-1)) / 1.02; d[i] = b*3.5; }
  audio.noise = buf; return c;
}
function startSound(kind){
  const c = ensureAudio(); if (!c) return; c.resume && c.resume();
  if (kind==='wind'){
    const src = c.createBufferSource(); src.buffer=audio.noise; src.loop=true;
    const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=500;
    const g = c.createGain(); g.gain.value=.0;
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value=.09; lg.gain.value=.12; lfo.connect(lg).connect(g.gain);
    src.connect(f).connect(g).connect(c.destination); g.gain.setValueAtTime(.18,c.currentTime); src.start(); lfo.start();
    audio.nodes.wind = () => { src.stop(); lfo.stop(); };
  } else if (kind==='leaves'){
    const id = setInterval(() => {
      const src = c.createBufferSource(); src.buffer=audio.noise; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=2500+Math.random()*2000;
      const g=c.createGain(); const t0=c.currentTime; g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(.05,t0+.3); g.gain.linearRampToValueAtTime(0,t0+1.4);
      src.connect(f).connect(g).connect(c.destination); src.start(t0, Math.random()); src.stop(t0+1.5);
    }, 1300);
    audio.nodes.leaves = () => clearInterval(id);
  } else if (kind==='birds'){
    const chirp = () => {
      const t0 = c.currentTime, n = 2+Math.floor(Math.random()*3), base = 2600+Math.random()*1400;
      for (let i=0;i<n;i++){ const o=c.createOscillator(), g=c.createGain(); const s=t0+i*.13; o.type='sine';
        o.frequency.setValueAtTime(base,s); o.frequency.exponentialRampToValueAtTime(base*1.35,s+.07);
        g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(.05,s+.015); g.gain.exponentialRampToValueAtTime(.0005,s+.1);
        o.connect(g).connect(c.destination); o.start(s); o.stop(s+.12); }
    };
    chirp(); const id = setInterval(()=>{ if (Math.random()<.55) chirp(); }, 2400);
    audio.nodes.birds = () => clearInterval(id);
  }
}
function toggleSound(kind, btn){
  audio.on[kind] = !audio.on[kind];
  if (audio.on[kind]) startSound(kind); else { audio.nodes[kind] && audio.nodes[kind](); delete audio.nodes[kind]; }
  btn.setAttribute('aria-pressed', String(audio.on[kind])); btn.textContent = audio.on[kind] ? '끄기' : '켜기';
}

function adminData(){
  const pending=[], reports=[], deletes=[];
  for (const q of state.queueAll){
    for (const [id,it] of Object.entries(q.items||{})){
      if (it.state==='pending') pending.push({uid:q.uid, id, ...it});
      if (it.state==='delete_requested') deletes.push({uid:q.uid, id, ...it});
    }
    for (const [tid,r] of Object.entries(q.reports||{})) if (r.state!=='resolved') reports.push({uid:q.uid, treeId:tid, ...r});
  }
  pending.sort((a,b)=> (b.flags||[]).includes('crisis') - (a.flags||[]).includes('crisis') || (a.submittedAt||0)-(b.submittedAt||0));
  return {pending, reports, deletes};
}

    if (adminTab==='deletes'){
      if (!a.deletes.length) out.push(h('p',{text:'삭제 요청이 없어요.'}));
      else out.push(h('div',{class:'row end'}, h('button',{class:'btn small',type:'button',onclick:async()=>{ try{ for (const d of a.deletes){ await S.delForest(d.id); await S.adminQueueMerge(d.uid,{items:{[d.id]:{state:'deleted', body:'', title:''}}}); } toast('요청된 나무를 모두 지웠어요.'); }catch(e){ writeErr(e);} },text:`${a.deletes.length}그루 모두 삭제 처리`})));
      for (const d of a.deletes) out.push(treeCard(d, h('span',{class:'chip gray',text:'작성자 삭제 요청'}), null));
    }
    if (adminTab==='live'){
      if (!state.forest.length) out.push(h('p',{text:'아직 숲에 공개된 나무가 없어요.'}));
      for (const t of state.forest.slice().sort((a,b)=>(b.approvedAt||0)-(a.approvedAt||0))){
        const conf = h('div',{class:'confirm',hidden:true}, h('span',{text:'이 나무를 숲에서 숨길까요?'}),
          h('button',{class:'btn warn small',type:'button',onclick:async()=>{ try{ await S.delForest(t.id); const ow=ownerOf(t.id); if (ow) await S.adminQueueMerge(ow,{items:{[t.id]:{state:'hidden'}}}); toast('숲에서 숨겼어요.'); }catch(e){ writeErr(e);} },text:'숨기기'}));
        const btn = h('button',{class:'btn ghost small',type:'button',onclick:()=>{conf.hidden=false;btn.hidden=true;},text:'숲에서 숨기기'});
        out.push(treeCard(t, h('span',{class:'muted',text:`${STAGE_NAME[stageOf(t.x,t.y)]} 구역`}), h('div',{class:'row end'}, btn, conf)));
      }
    }
    return out;
  };
  openPanel('admin','운영실', render(), {wide:true, refresh(force){ const pb=$('#pbody'); const st=pb.scrollTop; pb.textContent=''; pb.append(...render()); pb.scrollTop = force?0:st; }});
}

/* ===================== data wiring ===================== */
function onData(){ rebuild(); refreshPanel(); }
async function boot(){
  resize(); rebuild(); requestAnimationFrame(frame);
  const lg = $('#logo').getContext('2d'); lg.drawImage(SPR.hope,0,0);
  if (!ls.get('forest.welcomed', false)) openGuide(true);
  let db = null, user = null;
  try { if (window.claude && window.claude.use){ [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } } catch {}
  if (db && user){
    let uid = null; try { uid = await user.id(); } catch {}
    state.uid = uid; state.mode = 'remote'; S.useRemote(db);
    try { state.admin = !!(await user.canEdit()); } catch {}
    try { const cw = await user.can('data.write'); state.canWrite = cw !== false; } catch {}
    if (!uid) state.canWrite = false;
    S.subForest(d => { state.forest = d.filter(t=>inb(t.x,t.y)); onData(); });
    if (uid){
      S.subMine(d => { state.mine = d; onData(); });
      S.subMyQueue(d => { state.myQueue = d; onData(); });
    }
    if (state.admin) S.subQueueAll(d => { state.queueAll = d; onData(); });
  } else {
    state.mode = 'local'; state.uid = 'local'; state.admin = true; S.useLocal();
    S.subForest(d => { state.forest = d; onData(); });
    S.subMine(d => { state.mine = d; onData(); });
    S.subMyQueue(d => { state.myQueue = d; onData(); });
    S.subQueueAll(d => { state.queueAll = d; onData(); });
  }
  onData();
}
if (document.fonts && document.fonts.load) document.fonts.load('16px Jua').catch(()=>{});
boot();
})();
</script>
